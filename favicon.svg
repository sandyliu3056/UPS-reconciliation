<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- 兩個對話框斜著對角擺:貓在右上、狗在左下,尾巴朝中間的心。
     16px 只剩三樣認得出來 —— 深色圓底、兩塊米白、一點黃,所以先讓那三樣站住。 -->
<rect width="64" height="64" rx="15" fill="#3E2A20"/>

<!-- ================= 左下:狗 ================= -->
<g transform="rotate(-10 20 43)">
  <!-- 兩隻垂耳,壓在框子後面先畫。都垂在左側 —— 右側是勾勾和框子尾巴,
       放不下第二隻,兩隻疊在左邊反而一眼就是狗的垂耳。後面那隻深一點。 -->
  <path d="M15 34c-8.5 0-11 6-9.6 12.4 1 4.8 4.8 6.6 8.8 5.8Z"
        fill="#A56A34" stroke="#2E1C14" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M18.5 35.5c-5.6 .4-7.4 5.2-6.4 9.8.8 3.8 3.8 5.2 6.8 4.6Z"
        fill="#B5793F" stroke="#2E1C14" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 框子,右下角一個小尾巴指向勾勾 -->
  <path d="M11 34h20a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H20l-3 4-1-4h-5a4 4 0 0 1-4-4V38a4 4 0 0 1 4-4Z"
        fill="#FAF5EC" stroke="#2E1C14" stroke-width="2.7" stroke-linejoin="round"/>
  <g stroke="#2E1C14" stroke-width="2.6" stroke-linecap="round">
    <path d="M12.5 44.5h15"/><path d="M12.5 50h11"/>
  </g>
</g>

<!-- ================= 右上:貓 ================= -->
<g transform="rotate(-10 44 21)">
  <!-- 兩隻尖耳,做胖一點。框子頂邊在 y≈9,耳朵露在上面的部分要夠寬,
       描邊才不會把白底吃光,16px 下還看得出是白耳配粉紅內耳。 -->
  <path d="M37 11 40 1 45.5 10Z" fill="#FAF5EC" stroke="#2E1C14" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M55 11 52 1 46.5 10Z" fill="#FAF5EC" stroke="#2E1C14" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M40.2 9 41.2 4 43.6 8.4Z" fill="#F5A39C"/>
  <path d="M51.8 9 50.8 4 48.4 8.4Z" fill="#F5A39C"/>
  <!-- 框子,左下角尾巴指向心 -->
  <path d="M35 9h20a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4h-5l-1 4-3-4H35a4 4 0 0 1-4-4V13a4 4 0 0 1 4-4Z"
        fill="#FAF5EC" stroke="#2E1C14" stroke-width="2.7" stroke-linejoin="round"/>
  <g stroke="#2E1C14" stroke-width="2.6" stroke-linecap="round">
    <path d="M38 18h15"/><path d="M38 23.5h11"/>
  </g>
</g>

<!-- ================= 中間的勾勾 =================
     對帳工具用打勾比愛心貼切。深色一筆在下當描邊,黃色一筆疊上去,
     圓角收尾 —— 16px 下還是清楚的一個勾。 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M27.8 33 31.2 36.8 38.4 27" stroke="#2E1C14" stroke-width="6"/>
  <path d="M27.8 33 31.2 36.8 38.4 27" stroke="#EFA81C" stroke-width="3.4"/>
</g>

<!-- ================= 動態線,以勾勾為圓心 ================= -->
<g stroke="#EFA81C" stroke-width="2.6" stroke-linecap="round" fill="none">
  <g transform="translate(32 32.5) rotate(-150)">
    <path d="M8.5 -3.2a7.6 7.6 0 0 1 0 6.4"/>
    <path d="M11.8 -4.4a10.8 10.8 0 0 1 0 8.8"/>
  </g>
  <g transform="translate(32 32.5) rotate(30)">
    <path d="M8.5 -3.2a7.6 7.6 0 0 1 0 6.4"/>
    <path d="M11.8 -4.4a10.8 10.8 0 0 1 0 8.8"/>
  </g>
</g>
</svg>
