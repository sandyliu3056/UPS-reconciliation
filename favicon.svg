<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- 兩張單據斜斜相對:右上那張長貓耳、左下那張搭一隻垂下的狗耳,
     中間一枚金色勾 —— 兩份單子對過帳了。構圖照使用者提供的圖重繪。
     16px 只剩:深棕底、兩團白、一點金 —— 認得出來。 -->
<rect width="64" height="64" rx="15" fill="#3A2418"/>

<!-- ============ 右上:貓耳單據 ============
     耳朵矮而寬,底邊藏進卡片裡 —— 太尖會變成角。 -->
<g transform="rotate(9 44 22)">
  <g stroke="#2A1710" stroke-width="2.1" stroke-linejoin="round">
    <path d="M31.8 16 33.2 2.4 44.8 9.6Z" fill="#F7F1E6"/>
    <path d="M57.2 16 55.8 2.4 44.2 9.6Z" fill="#F7F1E6"/>
  </g>
  <path d="M34.7 11.4 35.4 5.6l5 3.1Z" fill="#F08E92"/>
  <path d="M54.3 11.4 53.6 5.6l-5 3.1Z" fill="#F08E92"/>
  <rect x="31" y="9.5" width="27" height="30" rx="6.5"
        fill="#F7F1E6" stroke="#2A1710" stroke-width="2.6"/>
  <path d="M36.5 20h15.5M36.5 26h11.5" fill="none"
        stroke="#2A1710" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- ============ 左下:狗耳單據 ============ -->
<g transform="rotate(-9 20 44)">
  <rect x="7" y="29" width="27" height="28" rx="6.5"
        fill="#F7F1E6" stroke="#2A1710" stroke-width="2.6"/>
  <!-- 垂耳貼著左緣往下掛,窄長的一瓣 -->
  <path d="M14.5 28.7c-7-.6-10.6 4.3-10 10.5.4 4.6 3.2 7.6 6.5 7.1
           3.1-.5 4.9-3.5 5.2-7.9l.5-9Z"
        fill="#9C5F23" stroke="#2A1710" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M11.6 31.8c-2.9.9-4.4 3.8-4.1 7.2" fill="none"
        stroke="#7A4517" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20.5 41h12M20.5 47h9" fill="none"
        stroke="#2A1710" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- ============ 中間:金勾與兩組對勾弧 ============ -->
<path d="M26 34 31.8 40.4 43 27.8" fill="none" stroke="#F2A71B"
      stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M19.6 24.6a8 8 0 0 1 6-3.4M21.7 28.6a4.6 4.6 0 0 1 3.4-2" fill="none"
      stroke="#F2A71B" stroke-width="2.1" stroke-linecap="round"/>
<path d="M45 42.8a8 8 0 0 1-6 3.4M42.9 38.8a4.6 4.6 0 0 1-3.4 2" fill="none"
      stroke="#F2A71B" stroke-width="2.1" stroke-linecap="round"/>
</svg>
